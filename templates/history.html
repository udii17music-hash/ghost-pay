{% extends "base.html" %}
{% block content %}
<div class="mobile-head"><h1>Transaction History</h1></div>
<div class="filter"><span class="selected">All</span><span>Received</span><span>Sent</span><span>Added</span></div>
<div class="card">
{% for tx in txs %}
<div class="tx">
  <div class="tx-icon">{{ '+' if tx.type=='Code Redeemed' else '−' }}</div>
  <div class="grow"><b>{{ tx.type }}</b><small>{{ tx.created_at }} · {{ tx.tx_id }}</small></div>
  <strong class="{{ 'positive' if tx.type=='Code Redeemed' else 'negative' }}">₹{{ "%.2f"|format(tx.amount) }}</strong>
</div>
{% else %}<div class="empty">No transactions.</div>{% endfor %}
</div>
{% endblock %}
